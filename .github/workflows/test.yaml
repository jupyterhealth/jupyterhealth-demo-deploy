name: test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"

      - name: install requirements
        run: |
          pip install -r requirements.txt

      # minimal tests for now, just verify that dependencies exist
      # and chart renders with default values
      - name: test support chart
        run: |
          helm dependency update charts/support
          helm template charts/support

      - name: update jhe chart
        run: |
          helm dependency update charts/jhe

      - name: test jhe chart (staging)
        run: |
          helm template charts/jhe -f config/staging/config.yaml

      - name: test jhe chart (prod)
        run: |
          helm template charts/jhe -f config/prod/config.yaml
