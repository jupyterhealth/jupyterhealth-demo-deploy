name: test

on:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.13"

      - name: install requirements
        run: |
          pip install -r requirements.txt

      # minimal tests for now, just verify that dependencies exist
      # and chart renders with default values
      - name: test support chart
        run: |
          helm dependency update charts/support
          helm template charts/support

      - name: test jhe chart
        run: |
          helm dependency update charts/jhe
          helm template charts/jhe
