{{- if .Values.sof.enabled }}
{{- $service := .Values.sof.service }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "jhe.fullname" . }}-sof
  labels:
    {{- include "jhe.labels" . | nindent 4 }}
  {{- with $service.annotations }}
  annotations:
    {{- . | toYaml | nindent 4 }}
  {{- end }}
spec:
  selector:
    app.kubernetes.io/component: sof
    {{- include "jhe.matchLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
  type: ClusterIP
{{- end }}
