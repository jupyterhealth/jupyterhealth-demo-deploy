{{- if .Values.clusterEntryPoint.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: cluster-entrypoint
  annotations:
    {{- with .Values.clusterEntryPoint.annotations }}
    {{ . | toYaml | nindent 4 }}
    {{- end }}
  labels:
    app: cluster-entrypoint
    heritage: {{ .Release.Service }}
    release: {{ .Release.Name }}
spec:
  type: {{ .Values.clusterEntryPoint.service.type }}
  ports:
  - name: http
    port: 80
    targetPort: 10080
  - name: https
    port: 443
    targetPort: 10443
  {{- with .Values.clusterEntryPoint.service.selector }}
  selector:
    {{ . | toYaml | nindent 4 }}
  {{- end }}
  externalTrafficPolicy: Local
{{- end }}
