jhe:
  coreData:
    assetlinks.json:
      - relation:
          - delegate_permission/common.handle_all_urls
        target:
          namespace: android_app
          package_name: com.jupyter.health
          sha256_cert_fingerprints:
            - "4F:98:AF:E7:A3:8E:5F:EA:47:EE:75:13:A9:BC:D7:56:1A:D4:99:D0:B8:12:22:21:65:05:AA:C2:A0:EB:86:B1"
    apple-app-site-association.json:
      applinks:
        details:
          - appIDs:
              - KZJSZ95597.com.jupyter.health.staging
            components:
              - /: /clients/ucsf-edge/*
                comment: UCSF Edge invitation links
  httpRoute:
    hostnames:
      - berkeley-jhe-staging.jupyterhealth.org
  env:
    ALLOWED_HOSTS: localhost,berkeley-jhe-staging.jupyterhealth.org
    DEBUG: "1"
    DJANGO_LOG_LEVEL: DEBUG
    SITE_TITLE: JupyterHealth Exchange (staging)
    SITE_URL: https://berkeley-jhe-staging.jupyterhealth.org
  mcp:
    env:
      MCP_RESOURCE_URL: https://mcp.berkeley-jhe-staging.jupyterhealth.org
    httpRoute:
      hostnames:
        - mcp.berkeley-jhe-staging.jupyterhealth.org
  openWearables:
    backend:
      env:
        ADMIN_EMAIL: admin@berkeley-jhe-staging.jupyterhealth.org
        API_BASE_URL: https://ow.berkeley-jhe-staging.jupyterhealth.org
    httpRoute:
      hostnames:
        - ow.berkeley-jhe-staging.jupyterhealth.org

sof:
  httpRoute:
    hostnames:
      - sof.berkeley-jhe-staging.jupyterhealth.org
